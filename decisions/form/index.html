body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body)}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:18px 96px}
h1{font-size:23px;line-height:1.25;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;margin:3px 0 0}

.status b{color:var(--ink);font-variant-numeric:tabular-nums}

.dot.on{background:var(--ok)}

nav.tabs::-webkit-scrollbar{display:none}

nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.n{font-family:var(--f-mono);font-size:11.5px;opacity:.85;margin-left:5px;font-variant-numeric:tabular-nums}
.nw{color:var(--open);font-weight:700;margin-left:4px}
nav.tabs button[aria-current="page"] .nw{color:inherit}
.sub{color:var(--muted);font-size:15px;margin:14px 0 6px}

.subnav button[aria-current="page"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.subnav .op{font-size:12px;color:var(--open);margin-left:6px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 15px;margin:12px 0;scroll-margin-top:72px}
.item.answered{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.t{font-weight:700;font-size:17px;line-height:1.35;text-wrap:balance;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;flex:none;max-width:45%}
.tag{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.tag.new{color:var(--open)}.tag.done{color:var(--ok)}.tag.blk{color:var(--blk)}.tag.dflt{color:var(--muted)}.tag.via{color:var(--accent);white-space:normal;text-align:right}
.id{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.applied{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;margin-top:6px}
.applied .lbl{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.applied .tag{color:var(--ok);text-transform:none;letter-spacing:0;white-space:normal;overflow-wrap:anywhere}
.applied a.tag{text-decoration:underline}
.ctx{font-size:15.5px;margin-top:8px;overflow-wrap:anywhere}
.ctx p{margin:0 0 6px}.ctx ul{margin:4px 0 6px;padding-left:20px}.ctx li{margin:3px 0}
.ctx .rec{font-weight:700;margin-top:6px}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--chip);padding:1px 5px;border-radius:5px}
.refs{font-size:14px;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.refs a{color:var(--accent)}.refs .off{color:var(--muted)}

.chain{margin:8px 0 0;padding-left:22px;font-size:14px}

.readfirst{font-size:14px;margin-top:8px;color:var(--muted)}.readfirst a{color:var(--accent)}
.opts{margin-top:10px;display:flex;flex-direction:column;gap:2px}
.opts label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:8px 6px;min-height:40px;border-radius:7px;font-size:15.5px}
.opts label:hover{background:var(--chip)}
.opts input{margin-top:4px;accent-color:var(--accent);flex:none;width:18px;height:18px}
.opts .d{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-left:6px;text-transform:uppercase;letter-spacing:.05em}
textarea{width:100%;margin-top:8px;min-height:60px;font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.saved{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:1em}
.dflts{margin:22px 0 4px;padding-top:10px;border-top:1px dashed var(--line)}
.dflts>summary{cursor:pointer;font-size:14.5px;color:var(--muted);min-height:40px;display:flex;align-items:center}
.dflts>summary:hover{color:var(--ink)}
.divider{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:24px 0 4px;padding-top:10px;border-top:1px dashed var(--line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 15px;margin:12px 0}
.panel h2{font-size:15px;margin:0 0 6px}
.panel ul{margin:0;padding-left:20px}.panel li{margin:3px 0}
.panel a{color:var(--accent)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td a{color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tools button,.tools label.btn{font:inherit;font-size:14px;min-height:38px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.ghead{font-size:13px;margin:22px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.out details{margin-top:6px}.out summary{cursor:pointer;font-size:14px;color:var(--accent)}
.optlist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:3px;font-size:15px}
.optlist li{padding:4px 8px;border-radius:6px;color:var(--muted)}
.optlist li.chosen{color:var(--ink);background:color-mix(in srgb,var(--ok) 16%,transparent);font-weight:700}
.optlist li.chosen::before{content:"✓ ";color:var(--ok)}
.ans{font-size:15px;margin:6px 0 0;overflow-wrap:anywhere}
.out .redo{font:inherit;font-size:13.5px;margin-top:8px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.empty{color:var(--muted);font-size:15px;padding:24px 0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.dlg-head a{color:var(--accent);font-size:14px}
.dlg-head button{font:inherit;font-size:14px;min-height:36px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 12px;cursor:pointer}
.dlg-body{padding:6px 16px 16px;overflow-wrap:anywhere;font-size:15.5px}
.dlg-body table{display:block;overflow-x:auto}
.dlg-body .hit{background:color-mix(in srgb,var(--accent) 14%,transparent)}
@media (prefers-reduced-motion:no-preference){.item{transition:border-color .2s}}

hould hosted Narthex run, and what may it cost?", "section": "decide", "group": "architecture", "resolved": true}, {"id": "adr-0002", "title": "Use the official MCP toolkit, online and on your own machine?", "section": "decide", "group": "architecture", "resolved": false}]}, {"label": "SAD \u00a710 and \u00a711 The first slice", "url": "docs/sad.html#10-walking-skeleton-for-m0", "peek": true, "why": "The first slice to build, from sign-up to an approved SRS, and the four contracts it freezes.", "before": [{"label": "SAD \u00a74 Key sequences"}, {"label": "SAD \u00a76 Security model"}, {"label": "SAD \u00a77 Deployment and \u00a79 Cost drivers"}], "for": [{"id": "adr-0002", "title": "Use the official MCP toolkit, online and on your own machine?", "section": "decide", "group": "architecture", "resolved": false}, {"id": "adr-0007", "title": "How long may a link for answering a form keep working?", "section": "decide", "group": "architecture", "resolved": true}, {"id": "adr-0009", "title": "Move the decision form from claude.ai to Narthex's own site?", "section": "decide", "group": "architecture", "resolved": false}]}, {"label": "SAD \u00a713 Open points and risks", "url": "docs/sad.html#13-open-points-and-risks", "peek": true, "why": "Known gaps: GitLab and Codeberg keys, preview features, and no threat model in the spec yet.", "before": [{"label": "SAD \u00a710 and \u00a711 The first slice"}], "for": [{"id": "adr-0008", "title": "Start with GitHub only, then add GitLab and Codeberg?", "section": "decide", "group": "architecture", "resolved": false}, {"id": "adr-0006", "title": "How should people and agents sign in to Narthex?", "section": "decide", "group": "architecture", "resolved": true}]}]}, {"id": "adr-0001", "kind": "decide", "section": "decide", "group": "architecture", "title": "Build Narthex's server in TypeScript, like specsite?", "ctx": "<p>TypeScript is the programming language specsite already uses, so one language covers the server, the web pages and the tools. The decision-form builder stays in Python.<\/p><ul><li>One language means fewer skills to learn and fewer moving parts.<\/li><li>It has the official toolkit for MCP, the way agents talk to Narthex.<\/li><li>People can try Narthex with one command, nothing to install by hand.<\/li><\/ul>", "refs": [{"label": "ADR-0001 (on GitHub)", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/adr/0001-server-runtime-typescript-node.md", "peek": false}, {"label": "SAD \u00a72 Components", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/SAD.md#2-components", "peek": false}, {"label": "REQ-IDN-8", "url": "docs/spec.html#req-idn-8", "peek": true}, {"label": "REQ-IFC-1", "url": "docs/spec.html#req-ifc-1", "peek": true}, {"label": "NFR-4", "url": "docs/spec.html#nfr-4", "peek": true}], "options": ["Yes, TypeScript (recommended)", "Use Python instead", "Discuss first"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "readFirst": [{"id": "r-architecture", "title": "Architecture: how Narthex will be built", "section": "read", "group": null, "resolved": false}]}, {"id": "adr-0002", "kind": "decide", "section": "decide", "group": "architecture", "title": "Use the official MCP toolkit, online and on your own machine?", "ctx": "<p>MCP is the standard way an AI agent talks to tools like Narthex. We use its official toolkit, over the internet for the hosted service and locally when you run Narthex yourself.<\/p><ul><li>Running it locally needs no account and no server.<\/li><li>Following the standard spares us chasing protocol changes by hand.<\/li><li>Replies stay short, so your agent spends fewer tokens, its paid word budget.<\/li><\/ul>", "refs": [{"label": "ADR-0002 (on GitHub)", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/adr/0002-mcp-sdk-and-transport.md", "peek": false}, {"label": "SAD \u00a79 Cost drivers", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/SAD.md#9-cost-drivers", "peek": false}, {"label": "REQ-IFC-1", "url": "docs/spec.html#req-ifc-1", "peek": true}, {"label": "REQ-IFC-2", "url": "docs/spec.html#req-ifc-2", "peek": true}, {"label": "REQ-IDN-3", "url": "docs/spec.html#req-idn-3", "peek": true}, {"label": "NFR-8", "url": "docs/spec.html#nfr-8", "peek": true}], "options": ["Yes, the official toolkit (recommended)", "Discuss first"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "readFirst": [{"id": "r-architecture", "title": "Architecture: how Narthex will be built", "section": "read", "group": null, "resolved": false}]}, {"id": "adr-0003", "kind": "decide", "section": "decide", "group": "architecture", "title": "Build the web pages with Astro, the tool specsite uses?", "ctx": "<p>Astro is a website builder that sends very little code to your phone, so pages load fast. specsite, which shows the documents, is already built on it.<\/p><ul><li>Documents and the decision inbox look and feel the same.<\/li><li>Fast on phones, even with a 200-question form.<\/li><li>The decision form page itself stays as it is today.<\/li><\/ul>", "refs": [{"label": "ADR-0003 (on GitHub)", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/adr/0003-web-gui-framework.md", "peek": false}, {"label": "SAD \u00a72 Components", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/SAD.md#2-components", "peek": false}, {"label": "REQ-IFC-3", "url": "docs/spec.html#req-ifc-3", "peek": true}, {"label": "NFR-2", "url": "docs/spec.html#nfr-2", "peek": true}, {"label": "NFR-6", "url": "docs/spec.html#nfr-6", "peek": true}], "options": ["Yes, Astro (recommended)", "Use a more popular one (Next.js)", "Discuss first"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "readFirst": [{"id": "r-architecture", "title": "Architecture: how Narthex will be built", "section": "read", "group": null, "resolved": false}]}, {"id": "adr-0005", "kind": "decide", "section": "decide", "group": "architecture", "title": "Keep Narthex's own data in PostgreSQL?", "ctx": "<p>PostgreSQL is a free, widely used database. It holds only the inbox and accounts; your documents and archived answers stay in your git repository.<\/p><ul><li>Every hosting company offers it ready-made.<\/li><li>One database keeps backups simple.<\/li><li>Running Narthex on your own machine needs no database at all.<\/li><\/ul>", "refs": [{"label": "ADR-0005 (on GitHub)", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/adr/0005-database.md", "peek": false}, {"label": "SAD \u00a75 Data and storage", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/SAD.md#5-data-and-storage", "peek": false}, {"label": "REQ-DAT-15", "url": "docs/spec.html#req-dat-15", "peek": true}, {"label": "INV-2", "url": "docs/spec.html#inv-2", "peek": true}, {"label": "NFR-5", "url": "docs/spec.html#nfr-5", "peek": true}], "options": ["Yes, PostgreSQL (recommended)", "Discuss first"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "readFirst": [{"id": "r-architecture", "title": "Architecture: how Narthex will be built", "section": "read", "group": null, "resolved": false}]}, {"id": "adr-0008", "kind": "decide", "section": "decide", "group": "architecture", "title": "Start with GitHub only, then add GitLab and Codeberg?", "ctx": "<p>GitHub, GitLab and Codeberg are sites that store code. Only GitHub gives Narthex the short, narrow access keys the spec asks for, so it goes first.<\/p><ul><li>GitLab follows in a later milestone.<\/li><li>Codeberg waits until its access keys can be limited to one project.<\/li><li>The first version, called M0, needs only a GitHub account.<\/li><\/ul>", "refs": [{"label": "ADR-0008 (on GitHub)", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/adr/0008-git-host-integration.md", "peek": false}, {"label": "SAD \u00a713 Open points and risks", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/SAD.md#13-open-points-and-risks", "peek": false}, {"label": "REQ-IDN-1", "url": "docs/spec.html#req-idn-1", "peek": true}, {"label": "REQ-IDN-4", "url": "docs/spec.html#req-idn-4", "peek": true}, {"label": "REQ-IDN-6", "url": "docs/spec.html#req-idn-6", "peek": true}], "options": ["GitHub first, the others later (recommended)", "All three from the start", "Discuss first"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "readFirst": [{"id": "r-architecture", "title": "Architecture: how Narthex will be built", "section": "read", "group": null, "resolved": false}]}, {"id": "adr-0009", "kind": "decide", "section": "decide", "group": "architecture", "title": "Move the decision form from claude.ai to Narthex's own site?", "ctx": "<p>Today the form lives on claude.ai. We keep the same page and teach it to save answers to Narthex instead, in four small steps (your rule: Narthex makes its own pages).<\/p><ul><li>Nothing changes for you while it moves.<\/li><li>During the move, answers from both places are merged.<\/li><li>claude.ai stays an option, no longer the only home.<\/li><\/ul>", "refs": [{"label": "ADR-0009 (on GitHub)", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/adr/0009-decision-form-migration.md", "peek": false}, {"label": "SAD \u00a74 Key sequences", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/SAD.md#4-key-sequences", "peek": false}, {"label": "REQ-DOC-16", "url": "docs/spec.html#req-doc-16", "peek": true}, {"label": "INV-18", "url": "docs/spec.html#inv-18", "peek": true}, {"label": "REQ-IFC-8", "url": "docs/spec.html#req-ifc-8", "peek": true}], "options": ["Yes, in four small steps (recommended)", "Rebuild the form from scratch", "Discuss first"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "readFirst": [{"id": "r-architecture", "title": "Architecture: how Narthex will be built", "section": "read", "group": null, "resolved": false}]}, {"id": "adr-0010", "kind": "decide", "section": "decide", "group": "architecture", "title": "Let a small helper wake the agent when you answer?", "ctx": "<p>Your agent never checks the form over and over. A tiny background helper waits for your answer and wakes the agent; if it can't run, you tell the agent you answered.<\/p><ul><li>Works even if you answer days later.<\/li><li>A faster push path comes once Claude Code supports it fully.<\/li><li>Meanwhile the agent keeps working on other things.<\/li><\/ul>", "refs": [{"label": "ADR-0010 (on GitHub)", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/adr/0010-answer-delivery.md", "peek": false}, {"label": "SAD \u00a74 Key sequences", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/SAD.md#4-key-sequences", "peek": false}, {"label": "REQ-IFC-6", "url": "docs/spec.html#req-ifc-6", "peek": true}, {"label": "REQ-DEC-39", "url": "docs/spec.html#req-dec-39", "peek": true}, {"label": "REQ-DEC-40", "url": "docs/spec.html#req-dec-40", "peek": true}, {"label": "REQ-DEC-41", "url": "docs/spec.html#req-dec-41", "peek": true}], "options": ["Yes, the helper with fallbacks (recommended)", "Discuss first"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "readFirst": [{"id": "r-architecture", "title": "Architecture: how Narthex will be built", "section": "read", "group": null, "resolved": false}]}, {"id": "adr-0011", "kind": "decide", "section": "decide", "group": "architecture", "title": "Keep all of Narthex's code in one repository?", "ctx": "<p>A repository is a project's folder of code and history on GitHub. One repository for the server, web pages, tools and knowledge keeps them in step; specsite stays separate because other projects use it.<\/p><ul><li>One version number for everything that ships together.<\/li><li>Paid sector packs never go into this public repository.<\/li><\/ul>", "refs": [{"label": "ADR-0011 (on GitHub)", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/adr/0011-monorepo-layout.md", "peek": false}, {"label": "SAD \u00a72 Components", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/SAD.md#2-components", "peek": false}, {"label": "REQ-DOC-14", "url": "docs/spec.html#req-doc-14", "peek": true}, {"label": "REQ-SKL-32", "url": "docs/spec.html#req-skl-32", "peek": true}, {"label": "REQ-KNB-12", "url": "docs/spec.html#req-knb-12", "peek": true}], "options": ["Yes, one repository (recommended)", "Discuss first"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "readFirst": [{"id": "r-architecture", "title": "Architecture: how Narthex will be built", "section": "read", "group": null, "resolved": false}]}, {"id": "adr-0012", "kind": "decide", "section": "decide", "group": "architecture", "title": "Run the same checks on your laptop, in the agent and in CI?", "ctx": "<p>CI is the robot that tests every change before it is merged. One checking tool runs in all three places, so a pass means the same everywhere.<\/p><ul><li>Works without the hosted service.<\/li><li>Serious problems block the change and alert the right reviewer.<\/li><li>No long-lived password is stored in CI.<\/li><\/ul>", "refs": [{"label": "ADR-0012 (on GitHub)", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/adr/0012-verify-engine-in-ci.md", "peek": false}, {"label": "SAD \u00a74 Key sequences", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/SAD.md#4-key-sequences", "peek": false}, {"label": "REQ-VER-3", "url": "docs/spec.html#req-ver-3", "peek": true}, {"label": "REQ-VER-6", "url": "docs/spec.html#req-ver-6", "peek": true}, {"label": "REQ-VER-7", "url": "docs/spec.html#req-ver-7", "peek": true}], "options": ["Yes, one tool everywhere (recommended)", "Discuss first"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "readFirst": [{"id": "r-architecture", "title": "Architecture: how Narthex will be built", "section": "read", "group": null, "resolved": false}]}, {"id": "adr-0013", "kind": "decide", "section": "decide", "group": "architecture", "title": "Keep Narthex's knowledge as files in the public repository?", "ctx": "<p>The knowledge base is the method, templates and sector guides your agent reads. The free part lives as reviewed files in the public repository; paid expert packs live elsewhere.<\/p><ul><li>Every change to the method is reviewed like code.<\/li><li>Paid packs reach only the teams that bought them.<\/li><li>Works offline when you run Narthex yourself.<\/li><\/ul>", "refs": [{"label": "ADR-0013 (on GitHub)", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/adr/0013-knowledge-base-store.md", "peek": false}, {"label": "SAD \u00a75 Data and storage", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/SAD.md#5-data-and-storage", "peek": false}, {"label": "REQ-KNB-1", "url": "docs/spec.html#req-knb-1", "peek": true}, {"label": "REQ-KNB-2", "url": "docs/spec.html#req-knb-2", "peek": true}, {"label": "REQ-KNB-12", "url": "docs/spec.html#req-knb-12", "peek": true}], "options": ["Yes, files in the repository (recommended)", "Discuss first"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "readFirst": [{"id": "r-architecture", "title": "Architecture: how Narthex will be built", "section": "read", "group": null, "resolved": false}]}, {"id": "q-auth-servers", "kind": "queue", "section": "queue", "group": null, "title": "Compare self-hosted sign-in servers against the built-in library", "ctx": "<p>You picked a separate sign-in server and asked which options fit better; if none does, built-in it is.<\/p>", "refs": [], "options": ["OK", "Do this first", "Stop it"], "default": null, "defaulted": false, "blocks": false, "applied": "ADR 0006 comparison"}, {"id": "u-auth-result", "kind": "update", "section": "updates", "group": null, "title": "Sign-in: no separate server fits better, so built-in it is", "ctx": "<p>Nine options were compared; following your answer, Narthex uses the built-in library, with Keycloak as the fallback.<\/p><ul><li>Keycloak: mature but heavy; its agent-login support is still experimental.<\/li><li>Zitadel is AGPL; Authentik and Authelia lack features we need.<\/li><li>The library had a critical flaw fixed in September: we pin versions and patch within days.<\/li><li>If a first test against a real agent fails, we switch to Keycloak.<\/li><\/ul>", "refs": [{"label": "ADR 0006", "url": "https://github.com/swimmingoncode/narthex/blob/main/docs/architecture/adr/0006-identity-and-sign-in.md", "peek": false}], "options": ["OK", "Comment (notes)"], "default": null, "defaulted": false, "blocks": false, "applied": null}, {"id": "r-plan", "kind": "read", "section": "read", "group": null, "title": "PLAN.md: how Narthex gets built, milestone by milestone", "ctx": "<p>The plan turns the architecture into milestones, features and one-change tasks. Read it before the Plan decisions.<\/p>", "refs": [{"label": "PLAN.md", "url": "https://github.com/swimmingoncode/narthex/blob/main/PLAN.md", "peek": false}], "options": ["Read, no comments", "Read, comments in notes", "Not yet"], "default": null, "defaulted": false, "blocks": false, "applied": null, "chain": [{"label": "PLAN \u00a71 How to read", "url": "docs/plan.html#1-how-to-read", "peek": true, "why": "The identifiers, and how milestones, features and tasks fit together.", "before": [{"label": "Architecture: how Narthex will be built", "item": {"id": "r-architecture", "title": "Architecture: how Narthex will be built", "section": "read", "group": null, "resolved": false}}], "for": []}, {"label": "PLAN \u00a73 Milestones", "url": "docs/plan.html#3-milestones", "peek": true, "why": "What each milestone delivers and the measurable checks that say it is done.", "before": [{"label": "PLAN \u00a71 How to read"}], "for": [{"id": "plan-first-level", "title": "Who should the first version guide: makers like you?", "section": "decide", "group": "plan", "resolved": false}, {"id": "plan-web-address", "title": "Which web address should the first hosted version use?", "section": "decide", "group": "plan", "resolved": true}, {"id": "plan-pilot-start", "title": "When should Bloque start using Narthex for real?", "section": "decide", "group": "plan", "resolved": false}]}, {"label": "PLAN \u00a72 Plan decisions", "url": "docs/plan.html#2-plan-decisions", "peek": true, "why": "The rules the build follows: one change per task, who merges, which AI model does what.", "before": [{"label": "PLAN \u00a71 How to read"}], "for": [{"id": "plan-merge-rule", "title": "May agents merge their own changes once every check passes?", "section": "decide", "group": "plan", "resolved": true}, {"id": "plan-watch-key", "title": "May the wake-up helper keep listening while you take days?", "section": "decide", "group": "plan", "resolved": true}]}, {"label": "PLAN \u00a74 Features and tasks", "url": "docs/plan.html#4-features-and-tasks", "peek": true, "why": "The first milestone in detail, including the wake-up helper and the sign-in work.", "before": [{"label": "PLAN \u00a73 Milestones"}], "for": [{"id": "plan-watch-key", "title": "May the wake-up helper keep listening while you take days?", "section": "decide", "group": "plan", "resolved": true}, {"id": "plan-merge-rule", "title": "May agents merge their own changes once every check passes?", "section": "decide", "group": "plan", "resolved": true}]}, {"label": "PLAN \u00a75 Dependencies and waves", "url": "docs/plan.html#5-dependencies-and-waves", "peek": true, "why": "Which work runs side by side, and the longest chain that sets the pace.", "before": [{"label": "PLAN \u00a74 Features and tasks"}], "for": []}, {"label": "Testing note \u00a72 Synthetic sessions", "url": "https://github.com/swimmingoncode/narthex/blob/main/notes/2026-10-17-testing-narthex.md#2-synthetic-sessions-l3", "peek": false, "why": "How AI agents playing users would test Narthex: personas, scenarios and checks.", "before": [{"label": "PLAN \u00a73 Milestones"}], "for": [{"id": "plan-test-scenarios", "title": "Which three practice runs should test Narthex first?", "section": "decide", "group": "plan", "resolved": false}, {"id": "plan-test-budget", "title": "How much may one practice run cost?", "section": "decide", "group": "plan", "resolved": true}]}, {"label": "PLAN \u00a76 Risks and open items", "url": "docs/plan.html#6-risks-and-open-items", "peek": true, "why": "The eight biggest risks, and the seven questions for you with their defaults.", "before": [{"label": "PLAN \u00a75 Dependencies and waves"}], "for": [{"id": "plan-first-level", "title": "Who should the first version guide: makers like you?", "section": "decide", "group": "plan", "resolved": false}, {"id": "plan-test-scenarios", "title": "Which three practice runs should test Narthex first?", "section": "decide", "group": "plan", "resolved": false}, {"id": "plan-test-budget", "title": "How much may one practice run cost?", "section": "decide", "group": "plan", "resolved": true}, {"id": "plan-web-address", "title": "Which web address should the first hosted version use?", "section": "decide", "group": "plan", "resolved": true}, {"id": "plan-merge-rule", "title": "May agents merge their own changes once every check passes?", "section": "decide", "group": "plan", "resolved": true}, {"id": "plan-watch-key", "title": "May the wake-up helper keep listening while you take days?", "section": "decide", "group": "plan", "resolved": true}, {"id": "plan-pilot-start", "title": "When should Bloque start using Narthex for real?", "section": "decide", "group": "plan", "resolved": false}]}, {"label": "PLAN \u00a77 Traceability", "url": "docs/plan.html#7-traceability", "peek": true, "why": "Optional: proof that every requirement has a home, or a milestone it waits for.", "before": [{"label": "PLAN \u00a74 Features and tasks"}], "for": []}]}, {"id": "plan-first-level", "kind": "decide", "section": "decide", "group": "plan", "title": "Who should the first version guide: makers like you?", "ctx": "<p>The first version ships guided questions for one kind of person only. The architecture planned for first-time builders, before the maker level existed.<\/p><ul><li>Makers have built with AI before but are not fluent in code.<\/li><li>You play a maker, so your own test run is a real one.<\/li><li>First-time builders and the other levels follow in the second milestone.<\/li><\/ul>", "refs": [{"label": "PLAN DEC-22", "url": "https://github.com/swimmingoncode/narthex/blob/main/PLAN.md#22-plan-only-decisions", "peek": false}, {"label": "PLAN \u00a73 Milestones", "url": "https://github.com/swimmingoncode/narthex/blob/main/PLAN.md#3-milestones", "peek": false}, {"label": "REQ-ITK-7", "url": "docs/spec.html#req-itk-7", "peek": true}, {"label": "ASM-59", "url": "docs/spec.html#asm-59", "peek": true}], "options": ["Makers first (recommended)", "First-time builders first", "Discuss first"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "readFirst": [{"id": "r-plan", "title": "PLAN.md: how Narthex gets built, milestone by milestone", "section": "read", "group": null, "resolved": false}]}, {"id": "plan-test-scenarios", "kind": "decide", "section": "decide", "group": "plan", "title": "Which three practice runs should test Narthex first?", "ctx": "<p>In the second milestone, AI agents play users and run through Narthex, so we catch breakage before real people do. We start with three scenarios.<\/p><ul><li>Happy path: a maker goes from an idea to an approved spec.<\/li><li>Unattended form: you vanish for days; the agent waits quietly, then resumes.<\/li><li>Spec gap: the agent meets a missing rule mid-build and must not guess.<\/li><li>More join later; every pilot problem becomes a new run.<\/li><\/ul>", "refs": [{"label": "Testing note \u00a72", "url": "https://github.com/swimmingoncode/narthex/blob/main/notes/2026-10-17-testing-narthex.md#2-synthetic-sessions-l3", "peek": false}, {"label": "PLAN F-025", "url": "https://github.com/swimmingoncode/narthex/blob/main/PLAN.md#42-m1-features", "peek": false}, {"label": "REQ-DEC-39", "url": "docs/spec.html#req-dec-39", "peek": true}, {"label": "REQ-SKL-24", "url": "docs/spec.html#req-skl-24", "peek": true}], "options": ["Happy path, unattended form, spec gap (recommended)", "Happy path, vague idea, reserved actions", "Discuss first"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "readFirst": [{"id": "r-plan", "title": "PLAN.md: how Narthex gets built, milestone by milestone", "section": "read", "group": null, "resolved": false}]}, {"id": "plan-pilot-start", "kind": "decide", "section": "decide", "group": "plan", "title": "When should Bloque start using Narthex for real?", "ctx": "<p>Real use at Bloque tells us whether Narthex builds the right thing. Starting earlier finds problems sooner but meets more rough edges.<\/p><ul><li>Recommended: start after the second milestone, on one Bloque project, while later work goes on.<\/li><li>Waiting for the hosted launch gives smoother tools but later lessons.<\/li><li>Installing Narthex on Bloque's code is a separate step you approve.<\/li><\/ul>", "refs": [{"label": "PLAN \u00a73 M2 onward", "url": "https://github.com/swimmingoncode/narthex/blob/main/PLAN.md#m2-onward", "peek": false}, {"label": "OQ-11", "url": "docs/spec.html#oq-11", "peek": true}, {"label": "REQ-CHN-13", "url": "docs/spec.html#req-chn-13", "peek": true}], "options": ["After the second milestone, on one project (recommended)", "After the hosted launch", "Discuss first"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "readFirst": [{"id": "r-plan", "title": "PLAN.md: how Narthex gets built, milestone by milestone", "section": "read", "group": null, "resolved": false}]}, {"id": "a-domain", "kind": "act", "section": "act", "group": null, "title": "Which domain should Narthex use for its subdomains?", "ctx": "<p>You chose subdomains of a domain we already hold. Tell me which one, so hosted Narthex gets its web addresses; nothing is bought.<\/p>", "refs": [{"label": "PLAN T-017-04", "url": "https://github.com/swimmingoncode/narthex/blob/main/PLAN.md#f-017-deploy-and-operations", "peek": false}, {"label": "REQ-IDN-8", "url": "docs/spec.html#req-idn-8", "peek": true}], "options": [], "default": null, "defaulted": false, "blocks": false, "applied": null}, {"id": "act-test-github-org", "kind": "act", "section": "act", "group": null, "title": "Create a GitHub test organisation for Narthex", "ctx": "<p>Later tasks need a throwaway organisation to test sign-in and the GitHub App against. Creating it is an outward action.<\/p><ul><li>The walking skeleton (T-018-02) and the sign-in spike (T-010-01) both run against it.<\/li><li>Use an organisation with no real repositories, so tests can create and delete freely.<\/li><li>Write the organisation's name in features/F-001-workspace/notes.md; no secret is involved.<\/li><\/ul>", "refs": [{"label": "PLAN.md, task T-001-06 (in the repo)", "url": null, "peek": false}, {"label": "PLAN.md, DEC-23 (in the repo)", "url": null, "peek": false}, {"label": "INV-4", "url": "docs/spec.html#inv-4", "peek": true}, {"label": "REQ-SKL-20", "url": "docs/spec.html#req-skl-20", "peek": true}, {"label": "DEC-23", "url": "docs/spec.html#dec-23", "peek": true}, {"label": "T-018-02", "url": "docs/spec.html#t-018-02", "peek": true}], "options": ["I'll create it and note its name", "Use an organisation I already own (name it)", "Discuss first"], "default": null, "defaulted": false, "blocks": true, "applied": null}, {"id": "act-github-oauth-app", "kind": "act", "section": "act", "group": null, "title": "Register a GitHub OAuth app for sign-in, with a localhost callback", "ctx": "<p>The sign-in spike (T-010-01) needs a real GitHub OAuth app. Its callback points at localhost until a hosted address exists.<\/p><ul><li>Register it under the test organisation, once that exists.<\/li><li>The callback URL is a localhost address; T-017-04 later files an item to point it at the hosted address.<\/li><li>Put the client id in features/F-001-workspace/notes.md. Put the client secret in the secret store, never in the repo.<\/li><\/ul>", "refs": [{"label": "PLAN.md, task T-001-06 (in the repo)", "url": null, "peek": false}, {"label": "PLAN.md, DEC-23 (in the repo)", "url": null, "peek": false}, {"label": "INV-4", "url": "docs/spec.html#inv-4", "peek": true}, {"label": "REQ-SKL-20", "url": "docs/spec.html#req-skl-20", "peek": true}, {"label": "DEC-23", "url": "docs/spec.html#dec-23", "peek": true}, {"label": "T-010-01", "url": "docs/spec.html#t-010-01", "peek": true}, {"label": "T-017-04", "url": "docs/spec.html#t-017-04", "peek": true}], "options": ["I'll register it and note the client id", "Discuss first"], "default": null, "defaulted": false, "blocks": true, "applied": null}, {"id": "act-github-app-test", "kind": "act", "section": "act", "group": null, "title": "Register a test GitHub App on the test organisation", "ctx": "<p>The git-host connector and the walking skeleton need a GitHub App they can install on the test organisation.<\/p><ul><li>Register it under the test organisation, once that exists.<\/li><li>Put the app id in features/F-001-workspace/notes.md. Put the private key and webhook secret in the secret store.<\/li><li>Install it only on the test organisation, never on a real one.<\/li><\/ul>", "refs": [{"label": "PLAN.md, task T-001-06 (in the repo)", "url": null, "peek": false}, {"label": "PLAN.md, DEC-23 (in the repo)", "url": null, "peek": false}, {"label": "INV-4", "url": "docs/spec.html#inv-4", "peek": true}, {"label": "REQ-SKL-20", "url": "docs/spec.html#req-skl-20", "peek": true}, {"label": "DEC-23", "url": "docs/spec.html#dec-23", "peek": true}, {"label": "T-018-02", "url": "docs/spec.html#t-018-02", "peek": true}], "options": ["I'll register it and note the app id", "Discuss first"], "default": null, "defaulted": false, "blocks": true, "applied": null}];const RESOLVED=[{"id": "v3-oq-1", "kind": "decide", "section": "decide", "group": "v3-product", "title": "What is Narthex's final name?", "ctx": "<p>Narthex is a codename (R1). A final name needs a trademark and domain search, and should suit the book.<\/p><ul><li>No candidate has been checked against trademarks, domains, npm or GitHub.<\/li><li>The book's title may want the same name.<\/li><\/ul><p class=\"rec\">Recommended: search first; a name that fails a trademark check costs a rename later.<\/p>", "refs": [{"label": "SPEC.md v0.3.0 (in the repo)", "url": null, "peek": false}, {"label": "Codenames note (in the repo)", "url": null, "peek": false}, {"label": "OQ-1", "url": "docs/spec.html#oq-1", "peek": true}], "options": ["Run a trademark and domain search first (recommended)", "Keep Narthex as the final name", "Discuss first"], "default": null, "defaulted": false, "blocks": false, "applied": null, "readFirst": [{"id": "r-spec", "title": "SPEC.md v0.3.0 and OVERVIEW.md", "section": "read", "group": null, "resolved": true}], "answer": {"choice": "Run a trademark and domain search first (recommended)", "notes": "", "at": "2026-10-17T18:23:34.556Z", "by": "u_I_crGe4UnsTeI8vf31ga_A"}, "led": [{"id": "q-name-search", "title": "Run a trademark and domain search for Narthex", "section": "queue", "sectionTitle": "Claude's queue", "group": null, "resolved": true}]}, {"id": "v3-oq-2", "kind": "decide", "section": "decide", "group": "v3-product", "title": "Where do newcomers' repositories live?", "ctx": "<p>Sign-up guides a newcomer to create a GitHub account (R13). A hosted git option would skip that step.<\/p><ul><li>A guided GitHub account keeps every repo user-owned, as R7 says.<\/li><li>Hosted git also suits regulated customers wanting a managed, audited store.<\/li><li>Hosting means taking custody of customers' code.<\/li><\/ul><p class=\"rec\">Recommended: a guided GitHub account in v1; hosted git later, when a customer needs it.<\/p>", "refs": [{"label": "SPEC.md v0.3.0 (in the repo)", "url": null, "peek": false}, {"label": "OQ-2", "url": "docs/spec.html#oq-2", "peek": true}, {"label": "REQ-ITK-3", "url": "docs/spec.html#req-itk-3", "peek": true}, {"label": "REQ-IDN-2", "url": "docs/spec.html#req-idn-2", "peek": true}, {"label": "DEF-3", "url": "docs/spec.html#def-3", "peek": true}], "options": ["Guided GitHub account now, hosted git later (recommended)", "Offer hosted git in v1", "Discuss first"], "default": null, "defaulted": false, "blocks": true, "applied": "amendment 0002", "readFirst": [{"id": "r-spec", "title": "SPEC.md v0.3.0 and OVERVIEW.md", "section": "read", "group": null, "resolved": true}], "answer": {"choice": "Guided GitHub account now, hosted git later (recommended)", "notes": "", "at": "2026-10-17T18:23:49.858Z", "by": "u_I_crGe4UnsTeI8vf31ga_A"}}, {"id": "v3-oq-3", "kind": "decide", "section": "decide", "group": "v3-product", "title": "What are Narthex's pricing and business model?", "ctx": "<p>Hosting, sign-up plans and limits per organisation all wait on this.<\/p><ul><li>Bloque's teams come first (R12), so the pilot shows what teams actually use.<\/li><li>Narthex runs no model of its own in v1, so model costs stay with the user.<\/li><\/ul><p class=\"rec\">Recommended: decide after the Bloque pilot, with usage figures in hand.<\/p>", "refs": [{"label": "SPEC.md v0.3.0 (in the repo)", "url": null, "peek": false}, {"label": "OQ-3", "url": "docs/spec.html#oq-3", "peek": true}], "options": ["Decide after the Bloque pilot (recommended)", "Draft a model now (notes)", "Discuss first"], "default": null, "defaulted": false, "blocks": false, "applied": null, "readFirst": [{"id": "r-spec", "title": "SPEC.md v0.3.0 and OVERVIEW.md", "section": "read", "group": null, "resolved": true}, {"id": "r-business-models", "title": "Open-source business models for Narthex", "section": "read", "group": null, "resolved": true}], "answer": {"choice": "Decide after the Bloque pilot (recommended)", "notes": "As you already saw, Narthex is open-source first. This means that the business model revolves around \u2026?", "at": "2026-10-17T18:24:46.085Z", "by": "u_I_crGe4UnsTeI8vf31ga_A"}, "led": [{"id": "q-business-models", "title": "Draft open-source business-model options for Narthex", "section": "queue", "sectionTitle": "Claude's queue", "group": null, "resolved": true}]}, {"id": "v3-oq-4", "kind": "decide", "section": "decide", "group": "v3-profiles", "title": "Which sector profiles ship first?", "ctx": "<p>Every profile keeps ids, invariants, amendments, decisions and the trace chain.<\/p><ul><li>product: SaaS and APIs; acceptance criteria as scenarios.<\/li><li>oss-ledger: Bloque's case; product plus ledger invariants with property tests.<\/li><li>protocol: fault model, safety and liveness properties, formal or executable reference.<\/li><\/ul><p class=\"rec\">Recommended: product and oss-ledger; they cover Bloque's teams, the first customers.<\/p>", "refs": [{"label": "SPEC.md v0.3.0 (in the repo)", "url": null, "peek": false}, {"label": "Research: spec formats (in the repo)", "url": null, "peek": false}, {"label": "OQ-4", "url": "docs/spec.html#oq-4", "peek": true}], "options": ["product and oss-ledger (recommended)", "Those plus protocol", "All five candidates"], "default": null, "defaulted": false, "blocks": false, "applied": "amendment 0002", "readFirst": [{"id": "r-spec", "title": "SPEC.md v0.3.0 and OVERVIEW.md", "section": "read", "group": null, "resolved": true}, {"id": "v3-r-references", "title": "REFERENCES.md", "section": "read", "group": null, "resolved": true}], "answer": {"choice": "All five candidates", "notes": "", "at": "2026-10-17T18:25:30.005Z", "by": "u_I_crGe4UnsTeI8vf31ga_A"}}, {"id": "v3-oq-5", "kind": "decide", "section": "decide", "group": "v3-profiles", "title": "May an executable or formal spec outrank SPEC.md?", "ctx": "<p>Ethereum's consensus specs are executable Python; protocols often make a formal model the reference.<\/p><ul><li>Per profile: protocol yes, others no.<\/li><li>SPEC.md still states which artefact is normative.<\/li><\/ul><p class=\"rec\">Recommended: yes, where the profile says so; the prose spec links to the normative artefact.<\/p>", "refs": [{"label": "SPEC.md v0.3.0 (in the repo)", "url": null, "peek": false}, {"label": "Research: spec formats (in the repo)", "url": null, "peek": false}, {"label": "OQ-5", "url": "docs/spec.html#oq-5", "peek": true}, {"label": "REQ-DAT-19", "url": "docs/spec.html#req-dat-19", "peek": true}], "options": ["Yes, where the profile says so (recommended)", "No, SPEC.md is always normative"], "default": null, "defaulted": false, "blocks": false, "applied": "amendment 0002", "readFirst": [{"id": "r-spec", "title": "SPEC.md v0.3.0 and OVERVIEW.md", "section": "read", "group": null, "resolved": true}, {"id": "v3-r-references", "title": "REFERENCES.md", "section": "read", "group": null, "resolved": true}], "answer": {"choice": "Yes, where the profile says so (recommended)", "notes": "", "at": "2026-10-17T18:25:47.916Z", "by": "u_I_crGe4UnsTeI8vf31ga_A"}}, {"id": "v3-oq-6", "kind": "decide", "section": "decide", "group": "v3-profiles", "title": "Does an agent count as an independent reviewer?", "ctx": "<p>Regulated profiles require review by someone other than the author. A lead plus agents needs a rule.<\/p><ul><li>A fresh reviewer agent is independent of the authoring agent, not of the lead's intent.<\/li><li>Assessors expect a person for safety levels.<\/li><\/ul><p class=\"rec\">Recommended: agents count for product and oss-ledger; a person is required under regulated profiles.<\/p>", "refs": [{"label": "SPEC.md v0.3.0 (in the repo)", "url": null, "peek": false}, {"label": "OQ-6", "url": "docs/spec.html#oq-6", "peek": true}, {"label": "REQ-VER-11", "url": "docs/spec.html#req-ver-11", "peek": true}], "options": ["Agents for product and oss-ledger; a person for regulated (recommended)", "Agents count everywhere", "Only a person counts"], "default": null, "defaulted": false, "blocks": false, "applied": "amendment 0002", "readFirst": [{"id": "r-spec", "title": "SPEC.md v0.3.0 and OVERVIEW.md", "section": "read", "group": null, "resolved": true}], "answer": {"choice": "Agents for product and oss-ledger; a person for regulated (recommended)", "notes": "", "at": "2026-10-17T18:26:05.317Z", "by": "u_I_crGe4UnsTeI8vf31ga_A"}}, {"id": "v3-oq-7", "kind": "decide", "section": "decide", "group": "v3-workflow", "title": "Does every amendment bump the spec version?", "ctx": "<p>Kippu kept v0.2.0 through four amendments, because a minor bump on v0 implied too much.<\/p><ul><li>Proposed: below v1.0.0, a patch bump, listed in the amendment.<\/li><li>From v1.0.0, a bump on every amendment.<\/li><\/ul><p class=\"rec\">Recommended: patch bumps below v1.0.0; the version still moves, without overstating the change.<\/p>", "refs": [{"label": "SPEC.md v0.3.0 (in the repo)", "url": null, "peek": false}, {"label": "OQ-7", "url": "docs/spec.html#oq-7", "peek": true}, {"label": "REQ-SKL-10", "url": "docs/spec.html#req-skl-10", "peek": true}], "options": ["Patch bump below v1.0.0, a bump from v1 (recommended)", "Bump on every amendment", "No bump before v1.0.0"], "default": null, "defaulted": false, "blocks": false, "applied": "amendment 0002", "readFirst": [{"id": "r-spec", "title": "SPEC.md v0.3.0 and OVERVIEW.md", "section": "read", "group": null, "resolved": true}], "answer": {"choice": "Patch bump below v1.0.0, a bump from v1 (recommended)", "notes": "", "at": "2026-10-17T18:26:55.145Z", "by": "u_I_crGe4UnsTeI8vf31ga_A"}}, {"id": "v3-oq-8", "kind": "decide", "section": "decide", "group": "v3-workflow", "title": "What does an agent do when it finds a spec gap?", "ctx": "<p>Kippu stopped and applied nothing unruled. aledgent and usage subscriptions built the conservative reading meanwhile.<\/p><ul><li>Proposed: build meanwhile only if it is the plan's reading or stricter.<\/li><li>Never change SPEC or PLAN before the ruling.<\/li><li>Otherwise stop the task and raise the item.<\/li><\/ul><p class=\"rec\">Recommended: the reconciliation above; it keeps work moving without applying anything looser than the plan.<\/p>", "refs": [{"label": "SPEC.md v0.3.0 (in the repo)", "url": null, "peek": false}, {"label": "OQ-8", "url": "docs/spec.html#oq-8", "peek": true}, {"label": "REQ-SKL-24", "url": "docs/spec.html#req-skl-24", "peek": true}], "options": ["Build only the plan's or a stricter reading (recommended)", "Always stop until ruled", "Always build the conservative reading"], "default": null, "defaulted": false, "blocks": true, "applied": "amendment 0002", "readFirst": [{"id": "r-spec", "title": "SPEC.md v0.3.0 and OVERVIEW.md", "section": "read", "group": null, "resolved": true}], "answer": {"choice": "Build only the plan's or a stricter reading (recommended)", "notes": "With a note: so far, reads are only partially useful as they only provide a reference of what to read, but they (nor the form) provide full chaining on what to read, only partial. We need full for Narthex.", "at": "2026-10-17T18:28:55.578Z", "by": "u_I_crGe4UnsTeI8vf31ga_A"}, "led": [{"id": "q-reading-chains", "title": "Add full reading chains to the form's Read items", "section": "queue", "sectionTitle": "Claude's queue", "group": null, "resolved": true}]}, {"id": "v3-oq-9", "kind": "decide", "section": "decide", "group": "v3-workflow", "title": "How are tests named?", "ctx": "<p>Kippu and aledgent put AC and INV ids in test names. On usage subscriptions you rejected that three times.<\/p><ul><li>Proposed: a per-project house rule.<\/li><li>Default: plain names, ids in a comment, read by the trace checks.<\/li><\/ul><p class=\"rec\">Recommended: a per-project setting, defaulting to plain names with ids in comments.<\/p>", "refs": [{"label": "SPEC.md v0.3.0 (in the repo)", "url": null, "peek": false}, {"label": "OQ-9", "url": "docs/spec.html#oq-9", "peek": true}, {"label": "REQ-SKL-30", "url": "docs/spec.html#req-skl-30", "peek": true}, {"label": "REQ-VER-4", "url": "docs/spec.html#req-ver-4", "peek": true}], "options": ["Per project; default plain names, ids in comments (recommended)", "Ids in test names everywhere", "Plain names everywhere"], "default": null, "defaulted": false, "blocks": false, "applied": "amendment 0002", "readFirst": [{"id": "r-spec", "title": "SPEC.md v0.3.0 and OVERVIEW.md", "section": "read", "group": null, "resolved": true}], "answer": {"choice": "Per project; default plain names, ids in comments (recommended)", "notes": "", "at": "2026-10-17T18:29:21.579Z", "by": "u_I_crGe4UnsTeI8vf31ga_A"}}, {"id": "v3-oq-10", "kind": "decide", "section": "decide", "group": "v3-workflow", "title": "When does a builder's change need an engineer?", "ctx": "<p>Alarms fire on a failed tagged check, a change to another team's identifier, or an unknown touchpoint.<\/p><ul><li>Green: merges on the builder's approval.<\/li><li>Amber: the identifier's owner reviews.<\/li><li>Red: blocks and pages an engineer, with check, product spec and diff.<\/li><\/ul><p class=\"rec\">Recommended: three tiers; engineers see only what touches what they own.<\/p>", "refs": [{"label": "SPEC.md v0.3.0 (in the repo)", "url": null, "peek": false}, {"label": "OQ-10", "url": "docs/spec.html#oq-10", "peek": true}, {"label": "REQ-VER-7", "url": "docs/spec.html#req-ver-7", "peek": true}], "options": ["Three tiers as described (recommended)", "Every change reviewed by an engineer", "Discuss first"], "default": null, "defaulted": false, "blocks": false, "applied": "amendment 0002", "readFirst": [{"id": "r-spec", "title": "SPEC.md v0.3.0 and OVERVIEW.md", "section": "read", "group": null, "resolved": true}], "answer": {"choice": "Three tiers as described (recommended)", "notes": "", "at": "2026-10-17T18:30:02.483Z", "by": "u_I_crGe4UnsTeI8vf31ga_A"}}, {"id": "v3-oq-11", "kind": "decide", "section": "decide", "group": "v3-product", "title": "Which builder and which product pilot Narthex at Bloque?", "ctx": "<p>Bloque's teams are the first customers (R12). A real non-engineer building a real operation proves the chain.<\/p><ul><li>Smallest useful: one operations flow on Bloque's core.<\/li><li>Needs the core's capabilities described first, by what each is for.<\/li><\/ul>", "refs": [{"label": "SPEC.md v0.3.0 (in the repo)", "url": null, "peek": false}, {"label": "OQ-11", "url": "docs/spec.html#oq-11", "peek": true}], "options": ["An operations flow on the core (details in notes)", "Discuss first"], "default": null, "defaulted": false, "blocks": true, "applied": "amendment 0003", "readFirst": [{"id": "r-spec", "title": "SPEC.md v0.3.0 and OVERVIEW.md", "section": "read", "group": null, "resolved": true}], "answer": {"choice": "An operations flow on the core (details in notes)", "notes": "", "at": "2026-10-17T18:24:54.277Z", "by": "u_I_crGe4UnsTeI8vf31ga_A"}, "led": [{"id": "a-pilot", "title": "Name the pilot builder and operations flow", "section": "act", "sectionTitle": "Act", "group": null, "resolved": true}]}, {"id": "v3-oq-12", "kind": "decide", "section": "decide", "group": "v3-profiles", "title": "Who checks the legal side of sector material, and when?", "ctx": "<p>Narthex ships open standards' text, and supplementary material for the rest (R4). Derived material may still raise copyright questions.<\/p><ul><li>ISO, IEC, RTCA and SAE texts are copyrighted.<\/li><li>Checklists and clause mappings are Narthex's own work, but cite closed texts.<\/li><\/ul><p class=\"rec\">Recommended: a lawyer, before the first pack with material derived from a standard ships.<\/p>", "refs": [{"label": "SPEC.md v0.3.0 (in the repo)", "url": null, "peek": false}, {"label": "OQ-12", "url": "docs/spec.html#oq-12", "peek": true}, {"label": "REQ-KNB-7", "url": "docs/spec.html#req-knb-7", "peek": true}], "options": ["A lawyer, before the first standards-derived pack (recommended)", "A lawyer, before any pack ships", "Discuss first"], "default": null, "defaulted": false, "blocks": false, "applied": "amendment 0002", "readFirst": [{"id": "r-spec", "title": "SPEC.md v0.3.0 and OVERVIEW.md", "section": "read", "group": null, "resolved": true}], "answer": {"choice": "A lawyer, before the first standards-derived pack (recommended)", "notes": "", "at": "2026-10-17T18:26:18.863Z", "by": "u_I_crGe4UnsTeI8vf31ga_A"}}, {"id": "v3-asm-trust", "kind": "decide", "section": "decide", "group": "v3-asm", "title": "Confirm the 9 trust and access assumptions?", "ctx": "<p>Trust and access: who may do what, and what an agent may do alone. Nobody has ruled these yet.<\/p><ul><li>One organisation with several teams shares one spec in v1 (ASM-1).<\/li><li>Agents sign in with OAuth 2.1 and get a short-lived token per task (ASM-4).<\/li><li>Commits come from the human or the signed app; snapshots use expiring links (ASM-5, ASM-6).<\/li><li>Agents may act on defaults of reversible items; they merge only when told (ASM-34, ASM-43).<\/li><li>Guard hooks refuse rule breaks; no certification is claimed (ASM-45, ASM-29, ASM-22).<\/li><\/ul>", "refs": [{"label": "SPEC.md \u00a713 Assumptions (in the repo)", "url": null, "peek": false}], "options": ["Confirm these assumptions (recommended)", "Change some (notes)", "Discuss first"], "default": null, "defaulted": false, "blocks": false, "applied": "amendment 0002", "readFirst": [{"id": "r-spec", "title": "SPEC.md v0.3.0 and OVERVIEW.md", "section": "read", "group": null, "resolved": true}], "answer": {"choice": "Confirm these assumptions (recommended)", "notes": "", "at": "2026-10-17T18:31:29.424Z", "by": "u_I_crGe4UnsTeI8vf31ga_A"}}, {"id": "0005-next", "kind": "decide", "section": "decide", "group": "profiles", "title": "Is the spec-profile work next?", "ctx": "<p>You called it the first assessment: an open-source fintech ledger and a safety-critical BFT system need different specs.<\/p><ul><li>Profiles as data: required sections, notation, trace rules, exports, gates.<\/li><li>specsite and the spec skill enforce the chosen profile.<\/li><\/ul>", "refs": [{"label": "Amendment 0005 (in the repo)", "url": null, "peek": false}, {"label": "Research: spec formats (in the repo)", "url": null, "peek": false}], "options": ["Yes, next, ahead of the other amendments (recommended)", "After 0002\u20130004 are ruled", "Discuss first"], "default": null, "defaulted": false, "blocks": true, "applied": "SPEC v0.3.0 \u00a76.6, \u00a77.1 (R18)", "answer": {"choice": "Folded into SPEC v0.3.0 with amendments 0002 to 0004", "notes": "Pablo, in chat on 2026-10-17, ruling R18: \"Rewrite SPEC.md now, folding in research, prior art, amendments 0001-0005 and the recommendations.\" The profile work is part of that rewrite.", "at": "2026-10-17T20:00:00-05:00", "by": "relayed:chat"}}, {"id": "0005-first", "kind": "decide", "section": "decide", "group": "profiles", "title": "Which profiles ship first?", "ctx": "<p>Every profile keeps ids, invariants, amendments, decisions and the trace chain.<\/p><ul><li>oss-ledger: Bloque's case; product plus ledger invariants with property tests.<\/li><li>protocol: fault model, safety and liveness properties, formal or executable reference.<\/li><li>safety: one profile with a level (DAL, ASIL, SIL, IEC 62304 class).<\/li><\/ul>", "refs": [{"label": "Amendment 0005 (in the repo)", "url": null, "peek": false}, {"label": "Research: spec formats (in the repo)", "url": null, "peek": false}], "options": ["oss-ledger and product (recommended)", "Those plus protocol", "All five candidates"], "default": null, "defaulted": false, "blocks": false, "applied": null, "superseded": {"id": "v3-oq-4", "title": "Which sector profiles ship first?"}}, {"id": "0005-normative", "kind": "decide", "section": "decide", "group": "profiles", "title": "May an executable or formal spec outrank SPEC.md?", "ctx": "<p>Ethereum's consensus specs are executable Python; protocols often make a formal model the reference.<\/p><ul><li>Per profile: protocol yes, others no.<\/li><li>SPEC.md still states which artefact is normative.<\/li><\/ul>", "refs": [{"label": "Amendment 0005 (in the repo)", "url": null, "peek": false}, {"label": "Research: spec formats (in the repo)", "url": null, "peek": false}], "options": ["Yes, where the profile says so (recommended)", "No, SPEC.md is always normative"], "default": null, "defaulted": false, "blocks": false, "applied": null, "superseded": {"id": "v3-oq-5", "title": "May an executable or formal spec outrank SPEC.md?"}}, {"id": "0005-independence", "kind": "decide", "section": "decide", "group": "profiles", "title": "Does an agent count as an independent reviewer?", "ctx": "<p>Regulated profiles require review by someone other than the author. A team of one lead plus agents needs a rule.<\/p><ul><li>A fresh reviewer agent is independent of the authoring agent, not of the lead's intent.<\/li><li>Assessors expect a person for safety levels.<\/li><\/ul>", "refs": [{"label": "Amendment 0005 (in the repo)", "url": null, "peek": false}, {"label": "Research: spec formats (in the repo)", "url": null, "peek": false}], "options": ["Agents for oss-ledger and product; a person for regulated (recommended)", "Agents count everywhere", "Only a person counts"], "default": null, "defaulted": false, "blocks": false, "applied": null, "superseded": {"id": "v3-oq-6", "title": "Does an agent count as an independent reviewer?"}}, {"id": "ru-section-order", "kind": "decide", "section": "decide", "group": "inbox", "title": "Sections follow a decision: Read, Decide, Act", "ctx": "<p>Pablo on aledgent's form, relayed on 2026-10-13: context first, then the ruling, then the action.<\/p>", "refs": [], "options": ["Read \u2192 Decide \u2192 Act, then Updates and Later", "Change it (notes)"], "default": null, "defaulted": false, "blocks": false, "applied": "skills/decision-form build.py (FLOW) and item-format.md", "answer": {"choice": "Read \u2192 Decide \u2192 Act, then Updates and Later", "notes": "Pablo on aledgent's form, 2026-10-13: \"shouldn't be Read before Decide and Decide before Act in the form?\" Relayed by the aledgent session.", "at": "2026-10-13T12:00:00-05:00", "by": "relayed:aledgent-session"}}, {"id": "oq-1", "kind": "decide", "section": "decide", "group": "product", "title": "Who is v1 for?", "ctx": "<p>The answer sets the licence, the name, and how much polish the first release needs.<\/p><ul><li>Own projects: fastest; aledgent's method, generalised.<\/li><li>Open source: needs docs, examples and a neutral house-rules default.<\/li><li>Product: needs hosting beyond claude.ai and several answerers.<\/li><\/ul><p class=\"rec\">Recommended: your own projects first; open it once a second project runs on it.<\/p>", "refs": [{"label": "v0.2.0 OQ-1", "url": null, "peek": false}], "options": ["My own projects first, open later (recommended)", "Open source from v1", "A product for other leads", "Discuss first"], "default": null, "defaulted": false, "blocks": true, "applied": "SPEC v0.3.0 \u00a71.5 (R12)", "answer": {"choice": "Bloque's teams, then engineers, then factories and consultants", "notes": "Pablo, in chat on 2026-10-17, ruling R12: \"First customers, in order: (1) Bloque's teams, not all of them software engineers; (2) individual engineers ... (3) software factories and consultants last.\" Recorded in notes/2026-10-17-rulings.md.", "at": "2026-10-17T20:00:00-05:00", "by": "relayed:chat"}}, {"id": "oq-2", "kind": "decide", "section": "decide", "group": "product", "title": "Is the decision inbox also a product on its own?", "ctx": "<p>The form needs nothing from the other modules: any lead with open questions could use it.<\/p><ul><li>As a module, it ships inside the plugin and can be used alone (REQ-WF-17).<\/li><li>As its own product, it needs its own name, page and hosting.<\/li><\/ul>", "refs": [{"label": "v0.2.0 OQ-2", "url": null, "peek": false}], "options": ["A module, usable alone (recommended)", "Its own product too", "Decide after the pilot"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "superseded": {"id": "v3-asm-form", "title": "Confirm the 15 form behaviour assumptions?"}}, {"id": "oq-3", "kind": "decide", "section": "decide", "group": "product", "title": "Under which licence is the code released?", "ctx": "<p>Only matters once anything leaves your machine (OQ-20).<\/p><ul><li>MIT or Apache-2.0: easiest to adopt; Apache adds a patent grant.<\/li><li>AGPL: keeps hosted forks open.<\/li><li>None yet: stay private until v1 works.<\/li><\/ul>", "refs": [{"label": "v0.2.0 OQ-3", "url": null, "peek": false}], "options": ["None yet; decide at first release (recommended)", "Apache-2.0", "MIT", "AGPL-3.0"], "default": null, "defaulted": false, "blocks": false, "applied": "Swimming on Code licence rule (STATE.md); amendment 0004", "answer": {"choice": "MIT", "notes": "Pablo's ruling of 2026-10-12, relayed by the aledgent session: SDD Studio and its by-products belong to Swimming on Code (copyright \"Pablo Dorado\" until incorporated); all Swimming on Code projects are MIT unless a stronger licence requires otherwise.", "at": "2026-10-12T18:00:00-05:00", "by": "relayed:aledgent-session"}}, {"id": "oq-4", "kind": "decide", "section": "decide", "group": "product", "title": "Keep the working name \"SDD Studio\" for now?", "ctx": "<p>The name appears in the plugin id, the repo and every skill's namespace.<\/p>", "refs": [{"label": "v0.2.0 OQ-4", "url": null, "peek": false}], "options": ["Keep it for now (recommended)", "Rename now (name in notes)"], "default": 0, "defaulted": true, "blocks": false, "applied": "SPEC v0.3.0 (R1); final name is OQ-1", "answer": {"choice": "Rename now (name in notes)", "notes": "Pablo, in chat on 2026-10-17, ruling R1: \"The name 'SDD Studio' is dropped. Use codenames until a final name is found.\" He chose the codename Narthex the same day (notes/2026-10-17-codenames.md).", "at": "2026-10-17T20:00:00-05:00", "by": "relayed:chat"}}, {"id": "oq-5", "kind": "decide", "section": "decide", "group": "inbox", "title": "Where does the form live in v1?", "ctx": "<p>aledgent's form is a claude.ai artifact with a database, answered from your phone and read back by the agent directly.<\/p><ul><li>Artifact: works today; tied to claude.ai and Claude Code's artifact tools.<\/li><li>Self-hosted page: any browser, but needs a backend and auth.<\/li><li>GitHub issues: familiar, but no defaults, sub-tabs or outbox.<\/li><\/ul><p class=\"rec\">Recommended: artifact now, behind a storage interface so another host can follow.<\/p>", "refs": [{"label": "v0.2.0 OQ-5", "url": null, "peek": false}, {"label": "v0.2.0 REQ-DI-12", "url": null, "peek": false}, {"label": "v0.2.0 REQ-DI-15", "url": null, "peek": false}], "options": ["claude.ai artifact, storage swappable later (recommended)", "Self-hosted page with a small backend", "GitHub issues or discussions", "Discuss first"], "default": null, "defaulted": false, "blocks": true, "applied": "SPEC v0.3.0 REQ-IFC-3, REQ-IFC-8 (R3)", "answer": {"choice": "Narthex's web GUI, linked from the MCP", "notes": "Pablo, in chat on 2026-10-17, ruling R3: \"Interface: MCP and a GUI. The GUI is web, with optional harness add-ons ... The MCP hands the user links into the UI.\" Recorded in notes/2026-10-17-rulings.md.", "at": "2026-10-17T20:00:00-05:00", "by": "relayed:chat"}}, {"id": "oq-6", "kind": "decide", "section": "decide", "group": "inbox", "title": "Is the repo the record of every answer?", "ctx": "<p>The store is where answers arrive; the archive in <code>decisions/responses/<\/code> is what the log and amendments cite.<\/p><ul><li>Repo as record: answers survive the host, and git shows when each arrived.<\/li><li>Store as record: one fewer step, but history depends on the host.<\/li><\/ul>", "refs": [{"label": "v0.2.0 OQ-6", "url": null, "peek": false}, {"label": "v0.2.0 INV-2", "url": null, "peek": false}], "options": ["The repo; the store is only an inbox (recommended)", "The store"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "superseded": {"id": "v3-asm-form", "title": "Confirm the 15 form behaviour assumptions?"}}, {"id": "oq-7", "kind": "decide", "section": "decide", "group": "inbox", "title": "Which format do agents write items in?", "ctx": "<p>Agents write items far more often than people do.<\/p><ul><li>JSON: no dependencies, strict, easy to validate.<\/li><li>YAML: easier to read, needs a parser.<\/li><li>Markdown files: readable per item, harder to check.<\/li><\/ul>", "refs": [{"label": "v0.2.0 OQ-7", "url": null, "peek": false}], "options": ["JSON (recommended)", "YAML", "One Markdown file per item"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "superseded": {"id": "v3-asm-form", "title": "Confirm the 15 form behaviour assumptions?"}}, {"id": "oq-8", "kind": "decide", "section": "decide", "group": "inbox", "title": "Do rulings also get their own decision-record files?", "ctx": "<p>Architecture Decision Records (ADRs) keep one short Markdown file per decision: context, choice, consequences. Here the log lists every answer and amendments carry the reasoning.<\/p><ul><li>Log only: one place to read, no duplication.<\/li><li>One file per ruling: ADR-compatible, more files to keep in step.<\/li><\/ul>", "refs": [{"label": "v0.2.0 OQ-8", "url": null, "peek": false}, {"label": "v0.2.0 REQ-DI-20", "url": null, "peek": false}], "options": ["Log plus amendments is enough (recommended)", "Also one ADR-style file per ruling"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "superseded": {"id": "v3-asm-form", "title": "Confirm the 15 form behaviour assumptions?"}}, {"id": "oq-9", "kind": "decide", "section": "decide", "group": "inbox", "title": "May agents apply a default before you answer?", "ctx": "<p>On aledgent, low-stakes items carried a default and were listed below a divider so you could overrule them.<\/p><ul><li>Only on reversible items.<\/li><li>Never on reserved items: outward actions, security, product rulings.<\/li><li>Every default is visible as 'Default applied'.<\/li><\/ul>", "refs": [{"label": "v0.2.0 OQ-9", "url": null, "peek": false}, {"label": "v0.2.0 REQ-DI-4", "url": null, "peek": false}, {"label": "v0.2.0 INV-4", "url": null, "peek": false}], "options": ["Yes, on reversible items only (recommended)", "No, every item waits for you"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "superseded": {"id": "v3-asm-trust", "title": "Confirm the 9 trust and access assumptions?"}}, {"id": "oq-10", "kind": "decide", "section": "decide", "group": "inbox", "title": "Which channel carries notifications?", "ctx": "<p>One notice per publish, naming sections and counts.<\/p>", "refs": [{"label": "v0.2.0 OQ-10", "url": null, "peek": false}, {"label": "v0.2.0 REQ-DI-23", "url": null, "peek": false}], "options": ["Claude push notifications (recommended)", "Slack DM", "Email digest"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "superseded": {"id": "v3-asm-form", "title": "Confirm the 15 form behaviour assumptions?"}}, {"id": "oq-11", "kind": "decide", "section": "decide", "group": "inbox", "title": "Can people other than you answer items?", "ctx": "<p>On aledgent, DevOps and partner questions went through you.<\/p><ul><li>v1: one answerer; items may name who should answer.<\/li><li>Later: per-item answerers, with each answer attributed.<\/li><\/ul>", "refs": [{"label": "v0.2.0 OQ-11", "url": null, "peek": false}], "options": ["Only me in v1 (recommended)", "Several answerers from v1"], "default": 0, "defaulted": true, "blocks": false, "applied": "SPEC v0.3.0 REQ-TEM-3, REQ-TEM-4 (R10)", "answer": {"choice": "Several answerers from v1", "notes": "Pablo, in chat on 2026-10-17, ruling R10: \"Multiple teams as proposed: identifier ownership per team, decision routing per role ...\" With R12, Bloque's teams come first.", "at": "2026-10-17T20:00:00-05:00", "by": "relayed:chat"}}, {"id": "oq-12", "kind": "decide", "section": "decide", "group": "inbox", "title": "Do \"Discuss first\" answers build a meeting agenda?", "ctx": "<p>Such answers stay open and are listed under 'To discuss' on the overview. An agenda page would group them for a call.<\/p>", "refs": [{"label": "v0.2.0 OQ-12", "url": null, "peek": false}, {"label": "v0.2.0 REQ-DI-19", "url": null, "peek": false}], "options": ["Yes, an agenda page from them (recommended)", "The overview list is enough"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "superseded": {"id": "v3-asm-form", "title": "Confirm the 15 form behaviour assumptions?"}}, {"id": "oq-15", "kind": "decide", "section": "decide", "group": "docs", "title": "How does an item open the spec at its anchor?", "ctx": "<p>The form already has a first version: a modal that shows just that section, with a link to the full page.<\/p>", "refs": [{"label": "v0.2.0 OQ-15", "url": null, "peek": false}, {"label": "v0.2.0 REQ-LD-6", "url": null, "peek": false}], "options": ["Modal with the section (recommended)", "Iframe of the full page at the anchor", "Side panel"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "superseded": {"id": "v3-asm-form", "title": "Confirm the 15 form behaviour assumptions?"}}, {"id": "oq-16", "kind": "decide", "section": "decide", "group": "docs", "title": "Are anchors taken from identifiers only?", "ctx": "<p><code>REQ-DI-4<\/code> becomes <code>#req-di-4<\/code> wherever it is defined. Heading text changes; identifiers never do.<\/p>", "refs": [{"label": "v0.2.0 OQ-16", "url": null, "peek": false}, {"label": "v0.2.0 REQ-LD-3", "url": null, "peek": false}], "options": ["Yes, identifiers; headings get slugs too (recommended)", "Heading slugs only"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "superseded": {"id": "v3-asm-form", "title": "Confirm the 15 form behaviour assumptions?"}}, {"id": "oq-18", "kind": "decide", "section": "decide", "group": "docs", "title": "Must research and explainers tag their evidence?", "ctx": "<p>The two explainer pages tagged each claim Code, Measured, Plan, Inference or Not in code, with commit-pinned citations.<\/p>", "refs": [{"label": "v0.2.0 OQ-18", "url": null, "peek": false}, {"label": "v0.2.0 REQ-LD-10", "url": null, "peek": false}], "options": ["Required in research and explainers (recommended)", "Recommended only"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "superseded": {"id": "v3-asm-form", "title": "Confirm the 15 form behaviour assumptions?"}}, {"id": "ru-specsite", "kind": "decide", "section": "decide", "group": "docs", "title": "Specs are generated from the .md; shared tools are public repos", "ctx": "<p>Pablo's principles while building specsite, relayed by the aledgent session on 2026-10-13.<\/p><ul><li>The <code>.md<\/code> is the source of truth; sites and editions are generated, never copied.<\/li><li>A tool other projects need is a public repo; reuse one that exists.<\/li><\/ul>", "refs": [{"label": "specsite intake note (in the repo)", "url": null, "peek": false}, {"label": "Amendment 0004 (in the repo)", "url": null, "peek": false}], "options": ["Adopt as relayed", "Change it (notes)"], "default": null, "defaulted": false, "blocks": false, "applied": "amendment 0004 (A2), notes/2026-10-12-specsite.md", "answer": {"choice": "Adopt as relayed", "notes": "Relayed by the aledgent session at Pablo's request, from its work of 2026-10-13: \"the .md is still the source of truth\"; a reusable tool for other projects is a public repo, and an existing one is used if it exists. Pablo created bloque-app/specsite and named it.", "at": "2026-10-12T12:00:00-05:00", "by": "relayed:aledgent-session"}}, {"id": "0004-specsite", "kind": "decide", "section": "decide", "group": "docs", "title": "Is specsite SDD Studio's living-docs module?", "ctx": "<p>swimmingoncode/specsite renders SPEC, PLAN and amendments in Starlight with id anchors and links, plus single-file HTML editions.<\/p><ul><li>Answers oq-13, oq-14 and oq-17, removed from this form.<\/li><li>Next on its roadmap: backlinks from decisions, a reference check, tombstones.<\/li><li>Its HTML editions published next to the form, so items open the spec in place.<\/li><\/ul>", "refs": [{"label": "specsite intake note (in the repo)", "url": null, "peek": false}, {"label": "Amendment 0004 (in the repo)", "url": null, "peek": false}, {"label": "v0.2.0 OQ-13", "url": null, "peek": false}, {"label": "v0.2.0 OQ-14", "url": null, "peek": false}, {"label": "v0.2.0 OQ-17", "url": null, "peek": false}, {"label": "v0.2.0 REQ-LD-5", "url": null, "peek": false}], "options": ["Yes, specsite is module LD (recommended)", "Keep them separate", "Discuss first"], "default": null, "defaulted": false, "blocks": true, "applied": null, "superseded": {"id": "v3-asm-docs", "title": "Confirm the 9 docs and profiles assumptions?"}}, {"id": "0004-needs", "kind": "decide", "section": "decide", "group": "docs", "title": "Add a needs.json-compatible export to specsite?", "ctx": "<p>Lets traceability tools (sphinx-needs, DOORS) read our requirements without rewriting our Markdown.<\/p>", "refs": [{"label": "specsite intake note (in the repo)", "url": null, "peek": false}, {"label": "Amendment 0004 (in the repo)", "url": null, "peek": false}], "options": ["Yes, after backlinks (recommended)", "Not now"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "superseded": {"id": "v3-asm-docs", "title": "Confirm the 9 docs and profiles assumptions?"}}, {"id": "oq-19", "kind": "decide", "section": "decide", "group": "workflow", "title": "How is the workflow packaged?", "ctx": "<p>Recommendation and reasons are in <code>notes/2026-10-03-packaging.md<\/code>.<\/p><ul><li>Plugin: skills, hooks, agents and templates installed as one versioned unit.<\/li><li>Model to copy: diagram-design ships one repo as a Claude Code plugin and an <code>npx skills add<\/code> skill.<\/li><li>Custom harness: full control, but loses the artifact tools the form relies on.<\/li><\/ul><p class=\"rec\">Recommended: a plugin now; a harness only if the dispatch board needs one.<\/p>", "refs": [{"label": "Packaging note (in the repo)", "url": null, "peek": false}, {"label": "v0.2.0 OQ-19", "url": null, "peek": false}], "options": ["A Claude Code plugin (recommended)", "Loose skills for now", "A custom harness on the Agent SDK", "Discuss first"], "default": null, "defaulted": false, "blocks": true, "applied": null, "superseded": {"id": "v3-asm-packaging", "title": "Confirm the 5 packaging and experiments assumptions?"}}, {"id": "oq-20", "kind": "decide", "section": "decide", "group": "workflow", "title": "Where does the code live, and is there a remote?", "ctx": "<p>The repo is local only, and a remote is an outward action, so it waits for you. SDD Studio belongs to Swimming on Code, where specsite now lives.<\/p><ul><li>Local: install from the folder through a local marketplace.<\/li><li>Swimming on Code org: public like specsite, MIT.<\/li><li>diagram-design shows the public-repo path: marketplace plus <code>npx skills add<\/code>.<\/li><\/ul>", "refs": [{"label": "v0.2.0 OQ-20", "url": null, "peek": false}], "options": ["Local until a second project runs it (recommended)", "Public repo in the Swimming on Code org"], "default": null, "defaulted": false, "blocks": false, "applied": null, "superseded": {"id": "v3-asm-packaging", "title": "Confirm the 5 packaging and experiments assumptions?"}}, {"id": "oq-21", "kind": "decide", "section": "decide", "group": "workflow", "title": "Which project pilots it after SDD Studio itself?", "ctx": "<p>A pilot proves the skills carry no aledgent-specific content.<\/p><ul><li>aledgent: real load, but mid-flight; retrofit the form and docs only.<\/li><li>A new Bloque project: clean start, every skill used.<\/li><\/ul>", "refs": [{"label": "v0.2.0 OQ-21", "url": null, "peek": false}], "options": ["aledgent's next feature (recommended)", "The next new Bloque project", "SDD Studio only for now"], "default": null, "defaulted": false, "blocks": true, "applied": null, "superseded": {"id": "v3-oq-11", "title": "Which builder and which product pilot Narthex at Bloque?"}}, {"id": "oq-22", "kind": "decide", "section": "decide", "group": "workflow", "title": "How do dispatched agents run?", "ctx": "<p>One agent per feature, each in its own worktree, with the house rules in its brief.<\/p><ul><li>Subagents in worktrees: what aledgent used; tied to one session.<\/li><li>Background sessions: survive the session, harder to track.<\/li><li>Cloud sessions: run unattended, need a remote.<\/li><\/ul>", "refs": [{"label": "v0.2.0 OQ-22", "url": null, "peek": false}, {"label": "v0.2.0 REQ-WF-6", "url": null, "peek": false}], "options": ["Subagents in worktrees (recommended)", "Background local sessions", "Cloud sessions"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "superseded": {"id": "v3-asm-method", "title": "Confirm the 18 chain and method assumptions?"}}, {"id": "oq-23", "kind": "decide", "section": "decide", "group": "workflow", "title": "When may an agent merge its own PR?", "ctx": "<p>aledgent's rule: merge only when the task allows it, and only with CI green.<\/p>", "refs": [{"label": "v0.2.0 OQ-23", "url": null, "peek": false}, {"label": "v0.2.0 REQ-WF-13", "url": null, "peek": false}], "options": ["Only when its task says so, CI green (recommended)", "Always, once CI is green", "Never; I merge"], "default": 0, "defaulted": true, "blocks": false, "applied": null, "superseded": {"id": "v3-asm-trust", "title": "Confirm the 9 trust and access assumptions?"}}, {"id": "oq-24", "kind": "decide", "section": "decide", "group": "workflow", "title": "Which candidate additions join v1?", "ctx": "<p>The README lists eight. Two depend only on the three modules.<\/p><ul><li>Traceability graph: requirement, decision, task, PR, test.<\/li><li>Amendment diff: spec versions with the decisions behind each change.<\/li><li>The rest (dispatch board, m
